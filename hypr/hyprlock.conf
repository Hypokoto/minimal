# ==============================================================================
# Minimal — Hyprlock Configuration
# ==============================================================================

general {
    grace = 2
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/Pictures/wallpapers/wallpaper.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.1
    contrast = 1.1
    noise = 0.02
}

# --- Clock ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(F2F6FFFF)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0A0C12CC)

    position = 0, 120
    halign = center
    valign = center
}

# --- Date ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(8D95B3FF)
    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, 30
    halign = center
    valign = center
}

# --- Password input box ---
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 1
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(1C2230FF)
    inner_color = rgba(11141DFF)
    font_color = rgba(F2F6FFFF)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    placeholder_text = <span foreground="##8D95B3"> Enter password...</span>
    hide_input = false
    rounding = 10

    check_color = rgba(00D9FFFF)
    fail_color = rgba(FF5470FF)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    capslock_color = rgba(FFCC66FF)

    position = 0, -80
    halign = center
    valign = center
}
