# ==============================================================================
# Aetheria — Global Keybindings & Media Pipeline
# ==============================================================================

# --- Variables & Modifiers ---
$mainMod = SUPER

# --- Core Applications ---
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, Space, exec, ~/.config/rofi/scripts/launcher.sh
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo,
bind = $mainMod, T, pseudo,

# --- Focus Movement (Vim-style) ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# --- Workspaces (1-5) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# --- Workspace Navigation & Toggling ---
bind = $mainMod, Tab, workspace, previous
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- Media & OSD Pipeline ---
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && ~/.config/hypr/scripts/osd-volume.sh
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ~/.config/hypr/scripts/osd-volume.sh
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.config/hypr/scripts/osd-volume.sh
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5% && ~/.config/hypr/scripts/osd-brightness.sh
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && ~/.config/hypr/scripts/osd-brightness.sh

# --- Custom Rofi Script Bindings ---
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod, Escape, exec, ~/.config/rofi/scripts/powermenu.sh
bind = $mainMod, B, exec, ~/.config/hypr/scripts/waybar-toggle.sh
bind = $mainMod SHIFT, B, exec, ~/.config/rofi/scripts/battery.sh
bind = $mainMod, C, exec, ~/.config/rofi/scripts/calendar.sh
bind = $mainMod, E, exec, ~/.config/rofi/scripts/emoji.sh
bind = $mainMod, N, exec, ~/.config/rofi/scripts/network.sh
bind = $mainMod, X, exec, ~/.config/rofi/scripts/clipboard.sh
bind = $mainMod, W, exec, ~/.config/hypr/wallpaper/picker.sh

# --- Window Drag/Resize with Mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, Print, exec, grim - | wl-copy && notify-send "Screenshot" "Copied to clipboard"
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Area copied to clipboard"
bind = CTRL, Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send "Screenshot" "Area saved"
