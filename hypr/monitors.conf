# ==============================================================================
# Aetheria — Monitor Topology
# Internal: auto-detect at preferred mode (eDP-1 / eDP-2 on most laptops)
# External: HDMI-A-1 at 1920x1080@60, placed to the right of the internal display
#
# To identify your connector names, run:
#   hyprctl monitors all
# Then replace the output= names below accordingly.
# Common connector names: eDP-1, HDMI-A-1, DP-1, DP-2, DP-3, HDMI-A-2
# ==============================================================================

# Internal display (laptop panel) — preferred mode, left anchor at origin
monitor = eDP-1,preferred,0x0,1

# External monitor — 1920x1080@60, positioned to the right of internal display
# Adjust resolution, refresh rate, and x-offset to match your panel:
#   x-offset = internal display width (e.g. 1920 for FHD internal, 2560 for QHD)
monitor = HDMI-A-1,1920x1080@60,1920x0,1

# Fallback: any unrecognized output auto-configures at preferred mode
monitor = ,preferred,auto,1
