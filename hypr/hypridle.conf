# ==============================================================================
# hypridle.conf — Minimal OS Shell Power Management & Idle Daemon Config
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Dim screen brightness after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = swayosd-client --brightness set 10 2>/dev/null || true
    on-resume = swayosd-client --brightness set 100 2>/dev/null || true
}

# 2. Lock screen via hyprlock after 10 minutes (600s)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 3. Turn off displays via DPMS after 15 minutes (900s)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
