# ==============================================================================
# Minimal — Core Configuration (Target: Hyprland 0.55.x+)
# ==============================================================================

# --- Core System Sourcing ---
source = ~/.config/hypr/colors.conf    # Generated from palette.md
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/keybinds.conf

# --- Autostart Applications ---
exec-once = ~/.config/hypr/scripts/waybar-autohide.sh
exec-once = mako
exec-once = awww-daemon
exec-once = sleep 0.5 && ~/.config/hypr/wallpaper/restore.sh
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- GPU Environment & Optimization (RX 6500, AMDGPU) ---
env = LIBVA_DRIVER_NAME,radeonsi
# Hardware Toggle: Isolated for specific low-VRAM/RDNA2 mobile KMS flicker workarounds if needed
# env = WLR_DRM_NO_ATOMIC,1
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = VDPAU_DRIVER,radeonsi

# --- Input Handling & Touchpad ---
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# --- Touchpad Workspace Swipe Gestures (Hyprland 0.51+) ---
# 3-finger horizontal swipe to switch workspaces in both directions.
gesture = 3, horizontal, workspace

# --- Core Compositor Look & Feel ---
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2
    
    layout = dwindle               
    allow_tearing = false
    resize_on_border = true
}

decoration {
    rounding = 10                  
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 4
        color = rgba(1a1a1aee)
    }
}

# --- Layout-Specific Behaviors ---
dwindle {
    # CRITICAL v0.55 FIX: pseudotile = true removed natively here.
    preserve_split = true
}

master {
    new_status = master
    mfact = 0.55
}

# --- Animations ---
animations {
    enabled = true
    bezier = aether, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, aether, popin 90%
    animation = fade, 1, 4, aether
    animation = workspaces, 1, 5, aether, slide
    animation = border, 1, 6, aether
}

# --- Miscellaneous ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# ==============================================================================
# Modern Unified Window Rules (0.55.x Block Format)
# ==============================================================================

windowrule {
    name = nvim-workspace-1
    match:class = ^(nvim)$
    workspace = 1
}

windowrule {
    name = nvchad-kitty-workspace-1
    match:class = ^(kitty)$
    match:title = ^(nvchad)$
    workspace = 1
}

windowrule {
    name = neotree-float-class
    match:class = ^(neo-tree)$
    float = on
    move = 75% 0%
    size = 25% 100%
}

windowrule {
    name = neotree-float-title
    match:title = ^(neo-tree)$
    float = on
    move = 75% 0%
    size = 25% 100%
}

windowrule {
    name = walker-float-center
    match:class = ^(walker)$
    float = on
    center = on
}

windowrule {
    name = nm-editor-float
    match:class = ^(nm-connection-editor)$
    float = on
}

windowrule {
    name = pavucontrol-float
    match:class = ^(pavucontrol)$
    float = on
    center = on
}

windowrule {
    name = rofi-center
    match:class = ^(Rofi)$
    float = true
    center = true
}

windowrule {
    name = polkit-agent
    match:class = ^(polkit-gnome-authentication-agent-1)$
    float = on
}
