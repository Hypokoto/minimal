[meta]
name = "obsidian"
author = "Hypokoto"
description = "Cold graphite and sky cyan minimal palette"

[tokens]
background    = "#0B0E14"
surface       = "#11161F"
overlay       = "#19212D"
text          = "#E8EDF5"
muted         = "#7F899B"
disabled      = "#475569"
primary       = "#7DD3FC"
secondary     = "#8BA4FF"
highlight     = "#B4A7FF"
success       = "#8BE28B"
warning       = "#E8C77B"
danger        = "#F08080"
info          = "#7DD3FC"
selection     = "#1E293B"
hover         = "#243144"
pressed       = "#0F172A"
focus         = "#38BDF8"
panel         = "#0F141C"
panel_variant = "#151C28"

[icon_roles]
default  = "text"
active   = "primary"
muted    = "muted"
disabled = "disabled"
success  = "success"
warning  = "warning"
error    = "danger"
info     = "info"

[geometry]
radius_sm = 6
radius_md = 12
radius_lg = 18

[spacing]
xs = 4
sm = 8
md = 12
lg = 16
xl = 24

[typography]
font = "Adwaita Sans"
mono = "AdwaitaMono Nerd Font"
