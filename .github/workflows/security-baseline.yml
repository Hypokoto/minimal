name: Security & Architecture Baseline

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_names: '.*'
          
  validate-symlinks:
    name: Broken Symlink Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find broken symlinks
        run: |
          broken=$(find . -xtype l)
          if [ -n "$broken" ]; then
            echo "Found broken symlinks:"
            echo "$broken"
            exit 1
          fi

  # Dependency scanning natively supported by GitHub (Dependabot)
  # Secret scanning is automatically active on public repos.
  validate-format:
    name: Shell format (shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shfmt
        uses: mfinelli/setup-shfmt@v3
      - run: shfmt -d .
  validate-packages:
    name: Package Tier Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run package validation
        run: ./scripts/validate-packages.sh

  validate-security:
    name: Security Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run security script audit
        run: ./scripts/audit-security.sh

  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
