# Minimal Starship Config — Bento Prompt Aesthetics
# Generated by minimalctl — DO NOT edit directly.

add_newline = false
command_timeout = 500

format = """
$directory\
$git_branch\
$git_status\
$package\
$c\
$cmake\
$golang\
$java\
$nodejs\
$python\
$rust\
$cmd_duration\
$line_break\
$character"""

# --- Directory ---
[directory]
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
style = "bold #7DD3FC"
format = "[$path]($style) "

# --- Git Branch ---
[git_branch]
symbol = " "
style = "#7F899B"
format = "on [$symbol$branch]($style) "

# --- Git Status ---
[git_status]
style = "#F08080"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "*"
staged = "+"
renamed = "»"
deleted = "✘"

# --- Languages / Toolchains ---
[c]
symbol = " "
style = "#7F899B"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "#7F899B"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "#7F899B"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "#7F899B"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "#7F899B"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "#7F899B"
format = "[$symbol$version]($style) "

# --- Execution Time ---
[cmd_duration]
min_time = 2_000
style = "#7F899B"
format = "took [$duration]($style) "

# --- Prompt Character ---
[character]
success_symbol = "[λ](bold #7DD3FC)"
error_symbol = "[λ](bold #F08080)"
