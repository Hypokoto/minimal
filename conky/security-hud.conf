conky.config = {
    -- Wayland specific setup
    out_to_wayland = true,
    out_to_x = false,

    -- Window settings
    own_window = true,
    own_window_class = 'ConkySecurityHUD',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 230,
    own_window_colour = '0A0C12',
    border_inner_margin = 20,
    border_outer_margin = 0,

    -- Rendering
    double_buffer = true,
    update_interval = 2.0,
    draw_shades = false,
    draw_outline = false,
    draw_borders = true,
    default_outline_color = '1C2230',
    default_shade_color = '1C2230',
    border_width = 2,
    default_color = 'F2F6FF',
    color1 = '00D9FF', -- Primary Cyan
    color2 = '8D95B3', -- Muted
    color3 = 'FF5470', -- Danger
    color4 = '4DFF91', -- Success

    -- Positioning (Corner)
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 60,
    minimum_width = 320,
    maximum_width = 320,

    -- Font & Colors
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=10',
}

conky.text = [[
${color1}${font JetBrainsMono Nerd Font:size=12:bold}SYSTEM HUD${font}${color} ${hr 2}
${voffset 4}${color2}OS:$color ${execi 86400 cat /etc/os-release | grep "PRETTY_NAME" | cut -d= -f2 | tr -d '"'}
${color2}KERNEL:$color $kernel
${color2}UPTIME:$color $uptime

${color1}${font JetBrainsMono Nerd Font:size=12:bold}HARDWARE${font}${color} ${hr 2}
${voffset 4}${color2}CPU: $color${cpu cpu0}% ${goto 180}${color2}RAM: $color$memperc%
${color2}TEMP:$color ${execi 2 sensors 2>/dev/null | grep 'Package id 0' | awk '{print $4}' | tr -d '+C' | head -n1}°C ${goto 180}${color2}MEM: $color$mem
${color1}${cpugraph cpu0 32,150 00D9FF 00D9FF}${goto 180}${color1}${memgraph 32,140 00D9FF 00D9FF}${color}

${color1}${font JetBrainsMono Nerd Font:size=12:bold}NETWORK${font}${color} ${hr 2}
${voffset 4}${color2}IFACE:$color ${gw_iface}
${color2}LOCAL IP:$color ${addr ${gw_iface}}
${color2}PUB IP:$color ${execi 3600 curl -s ifconfig.me || echo "Offline"}

${color2}ESTABLISHED:$color ${color4}${execi 2 ss -tun state established | wc -l | awk '{print $1-1}'}${color}
${color2}LISTEN TCP:$color ${color3}${execi 2 ss -tln | wc -l | awk '{print $1-1}'}${color}
${color2}LISTEN UDP:$color ${color3}${execi 2 ss -uln | wc -l | awk '{print $1-1}'}${color}
]]
