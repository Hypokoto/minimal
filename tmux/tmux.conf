# ===========================================================================
#  TMUX CONFIGURATION — Minimal Theme (Optimized)
#  Optimized for context-switching speed, vim integration, and signal clarity.
#  Dependencies: tmux >= 3.2
# ===========================================================================
#
#  RESCUE BINDINGS (for frozen/garbled pane):
#    Prefix + Ctrl+K  — soft reset: clear screen + exit copy mode
#    Prefix + X       — hard reset: send `reset` to pane (fixes garbled TUI)
#    q / Escape       — exit copy mode (vi bindings)
# ===========================================================================

# ---------------------------------------------------------------------------
#  §1  GENERAL SETTINGS & PERFORMANCE FIXES
# ---------------------------------------------------------------------------

# Eliminate escape-time delay. Default 500ms causes brutal lag when switching
# vim modes (Insert → Normal). Zero is the only acceptable value.
set -s escape-time 0

# Generous scrollback for data-heavy workflows (logs, build output, traces).
set -g history-limit 50000

# Full mouse support: pane resize, scroll, click-to-focus, text selection.
# Does not interfere with clipboard — Shift+click bypasses tmux selection.
set -g mouse on

# True color & 256-color support. The terminal-features line is the modern
# tmux 3.2+ approach; the terminal-overrides line provides backward compat.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"
set -ag terminal-overrides ",xterm-256color:Tc"

# Enable focus events so vim/neovim can detect window focus changes.
set -g focus-events on

# Faster command sequences — no delay between prefix and command.
set -sg repeat-time 400

# ---------------------------------------------------------------------------
#  §2  PREFIX KEY & CORE BINDINGS
# ---------------------------------------------------------------------------

# Remap prefix: C-a is biomechanically superior to C-b (home-row adjacent).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload configuration with a clean status bar confirmation.
bind r source-file ~/.tmux.conf \; display-message "  tmux.conf reloaded"

# ---------------------------------------------------------------------------
#  §3  PANE SPLITTING — Intuitive Visual Metaphors
# ---------------------------------------------------------------------------

# Vertical split: | or v (visual: a vertical line dividing the screen)
# Horizontal split: - or _ (visual: a horizontal line dividing the screen)
# FIXED: Removed 'h' as a split key because it directly conflicted with vim-navigation 'h'
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# New windows also inherit the current path.
bind c new-window -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
#  §4  PANE NAVIGATION & UTILITIES — Vim-style
# ---------------------------------------------------------------------------

# Alt+hjkl for instant pane switching without prefix key overhead.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Prefix + hjkl as a secondary navigation layer (muscle-memory fallback).
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Pane resizing with prefix + HJKL (uppercase = resize, lowercase = navigate).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quickly maximize/zoom a pane to focus on code, then toggle back
bind m resize-pane -Z

# Balance panes evenly (Equilibrium keys)
bind = select-layout even-horizontal
bind + select-layout even-vertical

# ---------------------------------------------------------------------------
#  §5  WINDOW & PANE INDEXING
# ---------------------------------------------------------------------------

# Base-1 indexing: matches physical keyboard layout (1-9, not 0-8).
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows sequentially when one is closed (no index gaps).
set -g renumber-windows on

# ---------------------------------------------------------------------------
#  §6  COPY MODE (Vi Bindings & System Clipboard Sync)
# ---------------------------------------------------------------------------

# Vi-style copy mode for muscle-memory consistency with vim.
setw -g mode-keys vi

# Native system clipboard integration for modern terminals (Kitty/Alacritty/iTerm)
set -g set-clipboard on

# v to begin selection, y to yank (mirrors vim visual mode exactly).
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Escape and q both exit copy mode cleanly (default q works; explicit Escape
# is needed for vi mode which doesn't bind it by default in older tmux).
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q      send-keys -X cancel

# ---------------------------------------------------------------------------
#  §6b  MOUSE COPY MODE — Prevent "stuck as text page" freeze
#
#  Root cause: With mouse=on + mode-keys=vi, scrolling the mouse wheel
#  silently enters copy mode. The pane appears frozen (like a text page)
#  because you are in copy mode — not because the shell died.
#
#  Fix: Mouse wheel scrolls history without locking into copy mode.
#  Releasing the scroll wheel returns immediately to normal mode.
#  Shift+scroll still enters persistent copy mode for reading long output.
# ---------------------------------------------------------------------------

# Mouse wheel scrolls — enter copy mode, scroll, then EXIT immediately.
# This means a brief scroll shows history but doesn't trap you in copy mode.
bind -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    "send-keys -M" \
    "copy-mode -e"

# -e flag on copy-mode means: automatically EXIT copy mode when you scroll
# back to the bottom. No manual 'q' needed after scrolling up and back down.

# Mouse drag to select text — enter copy mode only while dragging.
bind -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Double-click selects a word; Triple-click selects the line.
bind -T copy-mode-vi DoubleClick1Pane \
    select-pane \; send-keys -X select-word \; send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi TripleClick1Pane \
    select-pane \; send-keys -X select-line \; send-keys -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
#  §7  ACTIVITY & ALERT HANDLING
# ---------------------------------------------------------------------------

# Monitor window activity silently — no bell, no flashing, only color shifts
# in the status bar tab for the affected window.
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

# ---------------------------------------------------------------------------
#  §7b  PANE RESCUE BINDINGS — Fix frozen / garbled pane without killing it
#
#  When a long command finishes and the pane looks like a static text page,
#  it is almost always one of two things:
#    1. You scrolled into copy mode (mouse wheel) — press q to exit.
#    2. A TUI (fzf, bat, less) crashed without restoring the alternate screen.
#
#  These bindings recover both situations without killing the pane.
# ---------------------------------------------------------------------------

# Prefix + Ctrl+K — Soft rescue:
#   • Cancels copy mode (safe no-op if not in copy mode)
#   • Sends 'clear' to the shell to repaint the prompt cleanly
bind C-k send-keys -X cancel 2>/dev/null \; send-keys 'clear' Enter

# Prefix + X — Hard rescue (alternate screen corruption fix):
#   • Sends terminal 'reset' which clears the alternate screen buffer,
#     resets all attributes, and repaints the pane from scratch.
#   • Use this when Ctrl+K isn't enough (e.g. after fzf/bat crash).
bind X send-keys 'reset' Enter

# Prefix + Ctrl+Space — Escape all modes and return to shell prompt:
#   Forces exit from any mode (copy, clock, etc.) without clearing history.
bind -n M-Escape send-keys -X cancel 2>/dev/null

# ---------------------------------------------------------------------------
#  §8  MINIMAL STATUS BAR THEME
#
#  Palette Reference:
#    Background  #0A0C12  Deep Base
#    Surface     #11141D  Status Background
#    Overlay     #1C2230  Active Highlights / Inactive Borders
#    Text        #F2F6FF  High Contrast Body Text
#    Muted       #8D95B3  Secondary UI Labels
#    Primary     #00D9FF  Electric Active Accents
#    Danger      #FF5470  Attention Alerts
# ---------------------------------------------------------------------------

# Status bar position and refresh cadence
set -g status-position bottom
set -g status-interval 15

# Global status bar styling: Surface background, Muted foreground
set -g status-style "fg=#8D95B3,bg=#11141D"

# Status bar dimensions
set -g status-left-length 30
set -g status-right-length 60

# Left: Session name in a bold Minimal Primary accent block (Primary on Background)
set -g status-left "#[fg=#0A0C12,bg=#00D9FF,bold]  #S  #[fg=#00D9FF,bg=#11141D,nobold] "

# Right: Hostname + concise timestamp (Cleaned up redundant color tokens)
set -g status-right "#[fg=#F2F6FF,bg=#1C2230]  #h  #[fg=#0A0C12,bg=#00D9FF,bold] %Y-%m-%d %H:%M "

# Window status separator
set -g status-justify left
setw -g window-status-separator " "

# Inactive windows: Muted text on Surface background
setw -g window-status-format "#[fg=#8D95B3,bg=#11141D] #I:#W "

# Active window: Primary text on Overlay background + Zoomed status awareness [󰁌]
setw -g window-status-current-format "#[fg=#00D9FF,bg=#1C2230,bold] #I:#W#{?window_zoomed_flag, 󰁌 , } "

# Activity alert: Danger text on Surface background
setw -g window-status-activity-style "fg=#FF5470,bg=#11141D"

# Pane borders: Overlay for inactive, Primary accent for active
set -g pane-border-style "fg=#1C2230"
set -g pane-active-border-style "fg=#00D9FF"

# Message bar styling (Text on Overlay background)
set -g message-style "fg=#F2F6FF,bg=#1C2230,bold"

# Clock mode color
setw -g clock-mode-colour "#00D9FF"

# Copy/selection mode highlight colors (Background text on Primary highlight)
set -g mode-style "fg=#0A0C12,bg=#00D9FF"
