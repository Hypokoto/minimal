# ===========================================================================
#  TMUX CONFIGURATION — Minimal Theme (Optimized)
#  Generated by minimalctl — DO NOT edit directly.
# ===========================================================================

set -s escape-time 0
set -g history-limit 50000
set -g mouse on

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"
set -ag terminal-overrides ",xterm-256color:Tc"

set -g focus-events on
set -sg repeat-time 400

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display-message "  tmux.conf reloaded"

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind m resize-pane -Z
bind = select-layout even-horizontal
bind + select-layout even-vertical

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
set -g set-clipboard on

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q      send-keys -X cancel

bind -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    "send-keys -M" \
    "copy-mode -e"

bind -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi DoubleClick1Pane \
    select-pane \; send-keys -X select-word \; send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi TripleClick1Pane \
    select-pane \; send-keys -X select-line \; send-keys -X copy-selection-and-cancel

setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

bind C-k send-keys -X cancel 2>/dev/null \; send-keys 'clear' Enter
bind X send-keys 'reset' Enter
bind -n M-Escape send-keys -X cancel 2>/dev/null

# --- MINIMAL STATUS BAR THEME ---
set -g status-position bottom
set -g status-interval 15

set -g status-style "fg=#7F899B,bg=#11161F"

set -g status-left-length 30
set -g status-right-length 60

set -g status-left "#[fg=#0B0E14,bg=#7DD3FC,bold]  #S  #[fg=#7DD3FC,bg=#11161F,nobold] "
set -g status-right "#[fg=#E8EDF5,bg=#19212D]  #h  #[fg=#0B0E14,bg=#7DD3FC,bold] %Y-%m-%d %H:%M "

set -g status-justify left
setw -g window-status-separator " "

setw -g window-status-format "#[fg=#7F899B,bg=#11161F] #I:#W "
setw -g window-status-current-format "#[fg=#7DD3FC,bg=#19212D,bold] #I:#W#{?window_zoomed_flag, 󰁌 , } "
setw -g window-status-activity-style "fg=#F08080,bg=#11161F"

set -g pane-border-style "fg=#19212D"
set -g pane-active-border-style "fg=#7DD3FC"

set -g message-style "fg=#E8EDF5,bg=#19212D,bold"
setw -g clock-mode-colour "#7DD3FC"
set -g mode-style "fg=#0B0E14,bg=#7DD3FC"
